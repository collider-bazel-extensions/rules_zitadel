# Source: zitadel/templates/deployment_login.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-login
  namespace: zitadel
  labels:
    helm.sh/chart: zitadel-9.34.0
    app.kubernetes.io/name: zitadel-login
    app.kubernetes.io/instance: zitadel
    app.kubernetes.io/version: "v4.13.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: login
spec:
  revisionHistoryLimit: 10
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-login
      app.kubernetes.io/instance: zitadel
      app.kubernetes.io/component: login
  template:
    metadata:
      annotations:
        checksum/configmap: 019b27c2655a4bb92709c79769d97056e79a2a5c97cad119860a8ad77e10b249
      labels:
        helm.sh/chart: zitadel-9.34.0
        app.kubernetes.io/name: zitadel-login
        app.kubernetes.io/instance: zitadel
        app.kubernetes.io/version: "v4.13.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: login
    spec:
      serviceAccountName: zitadel-login
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      enableServiceLinks: false
      containers:
        - name: zitadel-login
          securityContext:
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
          image: "ghcr.io/zitadel/zitadel-login:v4.13.0@sha256:b1048d2652988a32518d5e4a26eecea0dd1db0792e144bd9715c7b96fdf3b1fd"
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_BASE_PATH
              value: /ui/v2/login
          ports:
          - containerPort: 3000
            name: http-server
            protocol: TCP
          livenessProbe:
            httpGet:
              path: /ui/v2/login/healthy
              port: http-server
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ui/v2/login/security
              port: http-server
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
          - name: login-config-dotenv
            mountPath: /.env-file/
            readOnly: true
          - name: login-client
            mountPath: /login-client
            readOnly: true
          resources:
              {}
      initContainers:
        # This initContainer acts as a dependency check, ensuring the Login UI pod
        # does not start until the main Zitadel API is fully initialized and ready
        # to serve traffic. It prevents a race condition where the UI might start,
        # fail to connect to the backend, and enter an error state.
        #
        # It uses the `wait4x` tool to poll the Zitadel pod's readiness endpoint
        # (`/debug/ready`). Startup is paused until this endpoint returns an HTTP 200
        # OK status. The `--insecure-skip-tls-verify` flag is included to support
        # environments that use self-signed certificates for internal TLS.
        - name: wait-for-zitadel
          image: docker.io/wait4x/wait4x:3.6@sha256:bec7ac18547781d854562c3729d3195c3880116d6758c49fdf4573ad58805f14
          imagePullPolicy: 'IfNotPresent'
          command:
            - wait4x
            - http
            - http://zitadel:8080/debug/ready
            - --insecure-skip-tls-verify
            - --h2c
            - --no-redirect
            - --expect-status-code
            - "200"
            - --timeout
            - "5m"
            - --interval
            - "5s"
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
      - name: login-config-dotenv
        configMap:
          name: zitadel-login-config-dotenv
      - name: login-client
        secret:
          defaultMode: 444
          secretName: login-client
